<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Academy Learning Club</title><link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="header"><a class="brand" href="#/">ACADEMY</a><nav><a href="#/courses">Cursos</a><a href="#/my-courses">Meus cursos</a><a href="#/cart">Carrinho</a><button id="account" class="button secondary">Entrar</button></nav></header>
  <main id="app" aria-live="polite"><p class="loading">Carregando cursos…</p></main>
  <dialog id="login-dialog"><form id="login-form"><button type="button" class="close" id="close-login" aria-label="Fechar">×</button><h2 id="auth-title">Entrar</h2><label id="name-field" hidden>Nome<input name="name" autocomplete="name"></label><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><label id="confirm-field" hidden>Confirmar senha<input name="password_confirmation" type="password" autocomplete="new-password"></label><p class="error" id="login-error"></p><button class="button" id="auth-submit">Entrar</button><button type="button" id="register-toggle" class="link-button">Criar uma conta</button></form></dialog>
  <script>window.ACADEMY_API_URL='https://api-pulso.cyara.com.br/api';</script><script src="./app.js" defer></script>
</body>
</html>
